<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>AETHER STATE | DEFINITIVE 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
        #ui { position: absolute; top: 20px; left: 20px; color: #00ffcc; pointer-events: none; z-index: 10; }
        #blocker { 
            position: absolute; width: 100%; height: 100%; 
            background: #000; display: flex; align-items: center; 
            justify-content: center; color: #fff; cursor: pointer; z-index: 100;
        }
        .hud { background: rgba(0,20,20,0.8); padding: 20px; border: 2px solid #00ffcc; border-radius: 5px; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; border: 1px solid #00ffcc; border-radius: 50%; transform: translate(-50%, -50%); }
    </style>
</head>
<body>

<div id="blocker" onclick="start()">
    <div style="text-align: center;">
        <h1 style="color: #00ffcc; font-size: 50px; margin: 0;">AETHER STATE</h1>
        <p style="color: #ff4d4d;">v7.0 - DEFINITIVE EDITION</p>
        <p style="margin-top: 50px; border: 2px solid #fff; padding: 20px;">KLIKKAA ALOITTAAKSESI</p>
        <p style="font-size: 12px; color: #666;">WASD = Liiku | HIIRI = Katso</p>
    </div>
</div>

<div id="ui">
    <div class="hud">
        <div id="status">TILA: SELLIOSASTO B</div>
        <div id="inv">ESINEET: TYHJÄ</div>
        <div id="msg" style="color: #ffcc00; margin-top: 10px;">VÄLTÄ VARTIJOITA JA ETSI ULOSKÄYNTI</div>
    </div>
</div>

<div id="crosshair"></div>

<script>
    let gameStarted = false;
    function start() {
        document.body.requestPointerLock();
        document.getElementById('blocker').style.display = 'none';
        gameStarted = true;
    }

    // --- 1. MOOTTORI ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a0a0a, 0.1);
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // --- 2. VALAISTUS ---
    const ambient = new THREE.AmbientLight(0x404040, 0.5);
    scene.add(ambient);

    // --- 3. MAAILMAN MATERIAALIT ---
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2 });
    const barMat = new THREE.MeshStandardMaterial({ color: 0x000000, metalness: 1 });
    const orangeMat = new THREE.MeshStandardMaterial({ color: 0xff6600 }); // Vankien asu

    // Lattia
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // --- 4. RAKENTAMINEN (SELLIT JA KÄYTÄVÄ) ---
    function buildPrison() {
        for(let i = 0; i < 6; i++) {
            let z = i * 15;
            // Seinät
            createWall(10, 4, z, 0.5, 8, 15); // Oikea seinä
            createWall(-10, 4, z, 0.5, 8, 15); // Vasen seinä
            
            // Kalterit
            for(let b = -7; b < 7; b += 1.5) {
                const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 8), barMat);
                bar.position.set(-6, 4, z + b);
                scene.add(bar);
            }

            // Valo jokaiseen käytävän osaan
            const light = new THREE.PointLight(0x00ffcc, 1, 20);
            light.position.set(0, 7, z);
            scene.add(light);
        }
    }

    function createWall(x, y, z, w, h, d) {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
        mesh.position.set(x, y, z);
        mesh.receiveShadow = true;
        scene.add(mesh);
    }
    buildPrison();

    // --- 5. HAHMOT (VARTIJA JA VANGIT) ---
    const guards = [];
    function createGuard(z) {
        const g = new THREE.Group();
        // Alaruumis (tankki)
        const base = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.8, 1.5), wallMat);
        // Yläruumis
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.7, 1.5), barMat);
        body.position.y = 1;
        // Pää ja Laser-silmä
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), wallMat);
        head.position.y = 2;
        const eye = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.1, 0.1), new THREE.MeshBasicMaterial({color: 0xff0000}));
        eye.position.set(0, 2.1, 0.4);
        
        g.add(base, body, head, eye);
        g.position.set(0, 0.4, z);
        g.dir = 1;
        scene.add(g);
        guards.push(g);
    }
    createGuard(20);
    createGuard(50);

    const inmates = [];
    function createInmate(x, z) {
        const inmate = new THREE.Group();
        const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.4, 1), orangeMat);
        body.position.y = 1;
        inmate.add(body);
        inmate.position.set(x, 0, z);
        inmate.dir = Math.random() > 0.5 ? 1 : -1;
        scene.add(inmate);
        inmates.push(inmate);
    }
    for(let i=0; i<5; i++) createInmate(-8, i*15);

    // --- 6. OHJAUS ---
    let keys = {};
    document.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
    document.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);
    
    document.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement) {
            camera.rotation.y -= e.movementX * 0.002;
            camera.rotation.x -= e.movementY * 0.002;
            camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
        }
    });

    camera.rotation.order = 'YXZ';
    camera.position.set(-8, 1.7, 5);

    // --- 7. PELISILMUKKA ---
    function update() {
        requestAnimationFrame(update);
        if (!gameStarted || !document.pointerLockElement) return;

        // Pelaajan liike
        const dir = new THREE.Vector3();
        camera.getWorldDirection(dir);
        dir.y = 0; dir.normalize();
        const side = new THREE.Vector3().crossVectors(new THREE.Vector3(0,1,0), dir).normalize();

        if (keys.w) camera.position.addScaledVector(dir, 0.1);
        if (keys.s) camera.position.addScaledVector(dir, -0.1);
        if (keys.a) camera.position.addScaledVector(side, 0.1);
        if (keys.d) camera.position.addScaledVector(side, -0.1);

        // Vartijoiden tekoäly
        guards.forEach(g => {
            g.position.z += 0.05 * g.dir;
            if (g.position.z > 80 || g.position.z < 10) g.dir *= -1;
            
            // Kiinnijääminen
            if (camera.position.distanceTo(g.position) < 2.5) {
                camera.position.set(-8, 1.7, 5);
                document.getElementById('msg').innerHTML = "KIINNI JÄIT! Vartija havaitsi liikettä.";
            }
        });

        // Vankien liike
        inmates.forEach(n => {
            n.position.z += 0.02 * n.dir;
            if (Math.abs(n.position.z % 15) > 5) n.dir *= -1;
        });

        renderer.render(scene, camera);
    }

    update();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
