<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>AETHER STATE | REMASTERED 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Segoe UI', sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; color: #00ffcc; pointer-events: none; z-index: 10; text-shadow: 2px 2px #000; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: #00ffcc; border-radius: 50%; transform: translate(-50%, -50%); z-index: 5; }
        #blocker { position: absolute; width: 100%; height: 100%; background: radial-gradient(circle, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.9) 100%); display: flex; align-items: center; justify-content: center; color: #fff; cursor: pointer; text-align: center; z-index: 20; }
        .hud-box { border-left: 5px solid #ff4d4d; padding-left: 15px; background: rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<div id="blocker">
    <div>
        <h1 style="color: #00ffcc; font-size: 60px; margin: 0; letter-spacing: 10px;">AETHER STATE</h1>
        <p style="letter-spacing: 2px;">VANKILAREMASTEROITU v4.0</p>
        <p style="margin-top: 30px; color: #aaa;">KLIKKAA TÄSTÄ ASTUAKSESI SISÄÄN</p>
    </div>
</div>

<div id="ui">
    <div class="hud-box">
        <h2 id="status" style="margin:0;">STATUS: ETSINTÄKUULUTETTU</h2>
        <p id="inv" style="color: #fff;">VARUSTEET: TYHJÄ</p>
        <p id="msg" style="color: #ffcc00; font-size: 14px;">Etsi pako-esine ruokalasta.</p>
    </div>
</div>

<div id="crosshair"></div>

<script>
    // --- 1. MAAILMAN ALUSTUS ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020202);
    scene.fog = new THREE.FogExp2(0x020202, 0.1);
    
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ReinhardToneMapping;
    document.body.appendChild(renderer.domElement);

    // --- 2. MATERIAALIT (VÄRIT JA PINNAT) ---
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8, metalness: 0.2 });
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.5, metalness: 0.5 });
    const metalMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.9, roughness: 0.1 });
    const glowMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });

    // --- 3. VANKILAN RAKENTAMINEN ---
    // Lattia (Heijastava)
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), floorMat);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    // Selli
    function createCell() {
        const wallGroup = new THREE.Group();
        const backWall = new THREE.Mesh(new THREE.BoxGeometry(10, 8, 0.5), wallMat);
        backWall.position.set(0, 4, -5);
        
        const bed = new THREE.Mesh(new THREE.BoxGeometry(4, 1, 2), new THREE.MeshStandardMaterial({color: 0x224488}));
        bed.position.set(-2, 0.5, -4);
        
        const toilet = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.7, 1.2), new THREE.MeshStandardMaterial({color: 0xdddddd}));
        toilet.position.set(4, 0.6, -4);
        
        wallGroup.add(backWall, bed, toilet);
        scene.add(wallGroup);
    }
    createCell();

    // Käytävä (Oranssit varoitusvalot)
    for(let i = 0; i < 5; i++) {
        const p1 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 8, 20), wallMat);
        p1.position.set(5, 4, i*20 + 10);
        const p2 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 8, 20), wallMat);
        p2.position.set(-5, 4, i*20 + 10);
        scene.add(p1, p2);

        const light = new THREE.PointLight(0xff6600, 1.5, 15);
        light.position.set(0, 6, i*20 + 10);
        scene.add(light);
    }

    // Ruokala ja Pöytä
    const table = new THREE.Mesh(new THREE.BoxGeometry(6, 1, 3), metalMat);
    table.position.set(0, 1, 50);
    scene.add(table);

    const spoon = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.05, 8, 16), metalMat);
    spoon.position.set(0, 1.6, 50);
    scene.add(spoon);

    // --- 4. ROBOTTIVARTIJA (Monimutkainen muoto) ---
    const guard = new THREE.Group();
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.4), new THREE.MeshStandardMaterial({color: 0xff0000}));
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.3, 1.5), metalMat);
    head.position.y = 1;
    const eye = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.1, 0.1), glowMat);
    eye.position.set(0, 1, 0.3);
    guard.add(head, body, eye);
    guard.position.set(0, 1, 20);
    scene.add(guard);

    // --- 5. PELAAJAN ASE (PULSSIASE) ---
    const gun = new THREE.Group();
    const barrel = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.5), metalMat);
    const detail = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.2), glowMat);
    detail.position.z = 0.1;
    gun.add(barrel, detail);
    camera.add(gun);
    gun.position.set(0.3, -0.2, -0.5);
    scene.add(camera);

    // --- 6. OHJAUS JA LIIKE ---
    let move = { f: false, b: false, l: false, r: false };
    let vel = new THREE.Vector3();
    let hasSpoon = false;

    document.addEventListener('keydown', (e) => {
        if(e.code === 'KeyW') move.f = true;
        if(e.code === 'KeyS') move.b = true;
        if(e.code === 'KeyA') move.l = true;
        if(e.code === 'KeyD') move.r = true;
    });
    document.addEventListener('keyup', (e) => {
        if(e.code === 'KeyW') move.f = false;
        if(e.code === 'KeyS') move.b = false;
        if(e.code === 'KeyA') move.l = false;
        if(e.code === 'KeyD') move.r = false;
    });

    document.body.addEventListener('click', () => document.body.requestPointerLock());
    document.addEventListener('mousemove', (e) => {
        if(document.pointerLockElement) {
            camera.rotation.y -= e.movementX * 0.002;
            camera.rotation.x -= e.movementY * 0.002;
            camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
        }
    });
    camera.rotation.order = 'YXZ';
    camera.position.set(0, 1.7, 0);

    // --- 7. PELISILMUKKA ---
    let guardWay = 1;
    function animate() {
        requestAnimationFrame(animate);
        
        if (document.pointerLockElement) {
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            dir.y = 0; dir.normalize();
            
            const side = new THREE.Vector3().crossVectors(new THREE.Vector3(0,1,0), dir).normalize();

            if(move.f) camera.position.addScaledVector(dir, 0.1);
            if(move.b) camera.position.addScaledVector(dir, -0.1);
            if(move.l) camera.position.addScaledVector(side, 0.1);
            if(move.r) camera.position.addScaledVector(side, -0.1);

            // Vartijan AI
            guard.position.z += 0.05 * guardWay;
            if(guard.position.z > 45 || guard.position.z < 10) guardWay *= -1;
            guard.rotation.y += 0.01;

            // Törmäykset
            if(camera.position.distanceTo(guard.position) < 1.5) {
                camera.position.set(0, 1.7, 0);
                document.getElementById('msg').innerHTML = "KIINNI JÄIT! Vartija skannasi sinut.";
                document.getElementById('msg').style.color = "red";
            }

            if(!hasSpoon && camera.position.distanceTo(spoon.position) < 2) {
                hasSpoon = true;
                spoon.visible = false;
                document.getElementById('inv').innerHTML = "VARUSTEET: MULTI-LUSIKKA";
                document.getElementById('msg').innerHTML = "Palaa selliin ja käytä lusikkaa pako-aukkoon!";
                document.getElementById('msg').style.color = "#00ffcc";
            }

            // Voitto
            if(hasSpoon && camera.position.z < 1 && Math.abs(camera.position.x) < 2) {
                alert("PAKO ONNISTUI! Olet vapaa Aether Statesta.");
                location.reload();
            }

            // Aseen heilunta (Realistinen efekti)
            gun.position.y = -0.2 + Math.sin(Date.now() * 0.005) * 0.01;
        }

        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
