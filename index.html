<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>AETHER STATE | LIVING WORLD v11</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: 'Segoe UI', sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; color: #fff; text-shadow: 2px 2px 4px #000; pointer-events: none; z-index: 10; }
        .hud { background: rgba(0,0,0,0.7); padding: 15px; border: 2px solid #fff; border-radius: 10px; }
        #blocker { position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; color: #fff; cursor: pointer; z-index: 100; }
    </style>
</head>
<body>

<div id="blocker" onclick="this.style.display='none'; document.body.requestPointerLock();">
    <div style="text-align: center;">
        <h1 style="font-size: 50px;">AETHER STATE</h1>
        <p>ELÄVÄ VANKILA: Vankeja, taivas ja katto</p>
        <p style="margin-top: 20px; background: white; color: black; padding: 10px;">KLIKKAA ALOITTAAKSESI</p>
    </div>
</div>

<div id="ui">
    <div class="hud">
        <div id="loc">PAIKKA: SELLI #1</div>
        <div id="pop">VANKILAN VÄKILUKU: 12</div>
        <div style="color: #00ffcc; margin-top: 5px;">Tavoite: Mene pihalle treenaamaan</div>
    </div>
</div>

<script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB); // Sininen taivas oletuksena

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // MATERIAALIT
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x666666, roughness: 0.9 });
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.8 });
    const ceilingMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
    const inmateMat = new THREE.MeshStandardMaterial({ color: 0xff6600 }); // Oranssi vankipuku

    // 1. KATTO JA LATTIA (Koko rakennus)
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Rakennuksen katto (Vain sisätiloissa x < 20)
    const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(40, 100), ceilingMat);
    ceiling.rotation.x = Math.PI / 2;
    ceiling.position.set(0, 5, 0);
    scene.add(ceiling);

    // 2. HUONEIDEN RAKENTAMINEN
    function createRoom(w, d, h, x, z, name) {
        const room = new THREE.Group();
        // Seinät
        const wallG = new THREE.BoxGeometry(w, h, 0.5);
        const wall1 = new THREE.Mesh(wallG, wallMat);
        wall1.position.set(x, h/2, z + d/2);
        scene.add(wall1);
        return room;
    }

    // Selliosasto
    for(let i = -2; i <= 2; i++) {
        let z = i * 10;
        // Sellien väliseinät
        const sWall = new THREE.Mesh(new THREE.BoxGeometry(8, 5, 0.5), wallMat);
        sWall.position.set(-10, 2.5, z);
        scene.add(sWall);
        
        // Kalterit käytävälle
        for(let b = -4; b <= 4; b += 1) {
            const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 5), new THREE.MeshStandardMaterial({color: 0x111111, metalness: 1}));
            bar.position.set(-6, 2.5, z + 5);
            scene.add(bar);
        }
    }

    // Takaseinä
    const backWall = new THREE.Mesh(new THREE.BoxGeometry(0.5, 5, 100), wallMat);
    backWall.position.set(-14, 2.5, 0);
    scene.add(backWall);

    // Ruokala (Avoimempi tila)
    const tableGeo = new THREE.BoxGeometry(4, 1, 2);
    for(let j = 0; j < 3; j++) {
        const table = new THREE.Mesh(tableGeo, wallMat);
        table.position.set(5, 0.5, j * 10 - 10);
        scene.add(table);
    }

    // 3. VANGIT (AI)
    const inmates = [];
    function spawnInmate(x, z) {
        const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.4, 1.2), inmateMat);
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.3), new THREE.MeshStandardMaterial({color: 0xffdbac}));
        head.position.y = 1;
        const inmate = new THREE.Group();
        inmate.add(body, head);
        inmate.position.set(x, 1, z);
        inmate.userData = { dir: Math.random() * Math.PI * 2, speed: 0.02 + Math.random() * 0.02 };
        scene.add(inmate);
        inmates.push(inmate);
    }

    // Luodaan vankeja eri puolille
    for(let i = 0; i < 8; i++) spawnInmate(Math.random() * 10 - 5, Math.random() * 40 - 20);

    // 4. VARTIJA
    const guard = new THREE.Group();
    guard.add(new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), new THREE.MeshStandardMaterial({color: 0x000033})));
    const eye = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.1, 0.2), new THREE.MeshBasicMaterial({color: 0xff0000}));
    eye.position.set(0, 0.8, 0.4);
    guard.add(eye);
    guard.position.set(10, 1, 0);
    scene.add(guard);

    // VALOT
    const ambient = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambient);
    const sun = new THREE.DirectionalLight(0xffffff, 1);
    sun.position.set(50, 50, 0);
    sun.castShadow = true;
    scene.add(sun);

    // OHJAUS
    let keys = {};
    document.addEventListener('keydown', (e) => keys[e.code] = true);
    document.addEventListener('keyup', (e) => keys[e.code] = false);
    document.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement) {
            camera.rotation.y -= e.movementX * 0.002;
            camera.rotation.x -= e.movementY * 0.002;
            camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
        }
    });

    camera.rotation.order = 'YXZ';
    camera.position.set(-10, 1.7, 5);

    function animate() {
        requestAnimationFrame(animate);
        
        if (document.pointerLockElement) {
            const speed = 0.1;
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            dir.y = 0; dir.normalize();
            const side = new THREE.Vector3().crossVectors(new THREE.Vector3(0,1,0), dir).normalize();

            if (keys['KeyW']) camera.position.addScaledVector(dir, speed);
            if (keys['KeyS']) camera.position.addScaledVector(dir, -speed);
            if (keys['KeyA']) camera.position.addScaledVector(side, speed);
            if (keys['KeyD']) camera.position.addScaledVector(side, -speed);

            // Vankien AI - Ne vaeltavat
            inmates.forEach(v => {
                v.position.x += Math.cos(v.userData.dir) * v.userData.speed;
                v.position.z += Math.sin(v.userData.dir) * v.userData.speed;
                if (v.position.x > 18 || v.position.x < -13) v.userData.dir += Math.PI;
                v.rotation.y = v.userData.dir;
            });

            // Sijainti-teksti
            if (camera.position.x > 20) {
                document.getElementById('loc').innerHTML = "PAIKKA: ULKOILUPIHA";
                scene.background.set(0x87CEEB); // Aurinkoinen taivas
            } else {
                document.getElementById('loc').innerHTML = "PAIKKA: SELLI-OSASTO / RUOKALA";
                scene.background.set(0x111111); // Pimeä sisällä
            }
        }
        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
