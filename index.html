<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>AETHER STATE | CODE ENGINE v8.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Orbitron', sans-serif; }
        #overlay { position: absolute; width: 100%; height: 100%; background: #000; display: flex; 
                   flex-direction: column; align-items: center; justify-content: center; 
                   color: #00ffcc; z-index: 1000; transition: 1s; }
        #ui-layer { position: absolute; bottom: 30px; left: 30px; color: #00ffcc; pointer-events: none; }
        .hud-card { background: rgba(0,20,20,0.8); padding: 20px; border: 2px solid #00ffcc; 
                    box-shadow: 0 0 15px rgba(0,255,204,0.3); border-radius: 5px; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 12px; height: 12px; 
                     border: 1px solid #00ffcc; border-radius: 50%; transform: translate(-50%, -50%); }
        .btn { border: 2px solid #00ffcc; background: none; color: #00ffcc; padding: 15px 30px; 
               cursor: pointer; font-size: 20px; letter-spacing: 5px; margin-top: 20px; }
        .btn:hover { background: #00ffcc; color: #000; }
    </style>
</head>
<body>

<div id="overlay">
    <h1 style="font-size: 60px; margin: 0;">AETHER STATE</h1>
    <p style="color: #666;">UNITY-STYLE HARDCODE EDITION</p>
    <button class="btn" onclick="initGame()">ASTU SISÄÄN</button>
</div>

<div id="ui-layer">
    <div class="hud-card">
        <div id="stat-cell">SIJAINTI: LOHKO-B</div>
        <div id="stat-inv">ESINEET: -</div>
        <div id="hint" style="color: #ff3366; font-size: 12px; margin-top: 10px;">> VÄLTÄ PUNAISET SENSORIT</div>
    </div>
</div>

<div id="crosshair"></div>

<script>
    // --- PELIN MOOTTORI JA MUUTTUJAT ---
    let scene, camera, renderer, clock;
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let velocity = new THREE.Vector3();
    let direction = new THREE.Vector3();
    let objects = []; // Törmäystarkistus
    let guards = [];
    let gameActive = false;

    function initGame() {
        document.getElementById('overlay').style.opacity = '0';
        setTimeout(() => document.getElementById('overlay').style.display = 'none', 1000);
        document.body.requestPointerLock();
        gameActive = true;
    }

    // --- MAAILMAN ALUSTUS ---
    function setup() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020205);
        scene.fog = new THREE.FogExp2(0x020205, 0.07);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(-8, 1.7, 5);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        clock = new THREE.Clock();

        // VALAISTUS
        const ambient = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambient);

        // --- RAKENTAMINEN (Ei neliöitä, vaan muotoja) ---
        const floorGeo = new THREE.PlaneGeometry(200, 200);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1, metalness: 0.5 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // LUODAAN SELLIT (Modulaarinen arkkitehtuuri)
        for(let i = 0; i < 8; i++) {
            createComplexCell(i * 12);
        }

        // --- VARTIJOIDEN LUONTI ---
        createAdvancedGuard(15);
        createAdvancedGuard(45);

        // TÖRMÄYKSET JA OHJAUS
        window.addEventListener('keydown', (e) => handleKeys(e.code, true));
        window.addEventListener('keyup', (e) => handleKeys(e.code, false));
        document.addEventListener('mousemove', onMouseMove);
        
        animate();
    }

    function createComplexCell(z) {
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x222225, roughness: 1 });
        
        // Ulkoseinä (paksu)
        createBox(0.5, 8, 12, -12, 4, z, wallMat);
        // Takaseinä
        createBox(12, 8, 0.5, -12, 4, z - 6, wallMat);
        
        // Kalterit (Parempi 3D-malli)
        const barGeo = new THREE.CylinderGeometry(0.08, 0.08, 8);
        const barMat = new THREE.MeshStandardMaterial({ color: 0x000000, metalness: 1 });
        for(let j = -5.5; j < 5.5; j += 1.2) {
            const bar = new THREE.Mesh(barGeo, barMat);
            bar.position.set(-6, 4, z + j);
            scene.add(bar);
            objects.push(bar);
        }

        // Valo käytävään
        const light = new THREE.PointLight(0x00ffcc, 1.2, 18);
        light.position.set(0, 7, z);
        scene.add(light);
    }

    function createBox(w, h, d, x, y, z, mat) {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
        mesh.position.set(x, y, z);
        mesh.receiveShadow = true;
        scene.add(mesh);
        objects.push(mesh); // Lisätään törmäyslistaan
    }

    function createAdvancedGuard(zPos) {
        const g = new THREE.Group();
        const metal = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.8 });
        
        // Tankkialusta
        const base = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 0.5, 6), metal);
        // Keskiruumis
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.5, 0.8), metal);
        body.position.y = 1;
        // Pää ja Laser
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.5), metal);
        head.position.y = 2.2;
        const eye = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.1, 0.1), new THREE.MeshBasicMaterial({color: 0xff0000}));
        eye.position.set(0, 2.2, 0.4);
        
        g.add(base, body, head, eye);
        g.position.set(2, 0.25, zPos);
        g.dir = 1;
        scene.add(g);
        guards.push(g);
    }

    // --- MOOTTORIN LOGIIKKA ---
    function handleKeys(code, state) {
        switch(code) {
            case 'KeyW': moveForward = state; break;
            case 'KeyS': moveBackward = state; break;
            case 'KeyA': moveLeft = state; break;
            case 'KeyD': moveRight = state; break;
        }
    }

    function onMouseMove(e) {
        if (document.pointerLockElement) {
            camera.rotation.y -= e.movementX * 0.002;
            camera.rotation.x -= e.movementY * 0.002;
            camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
        }
    }

    function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();

        if (gameActive && document.pointerLockElement) {
            // FYSIIKKA & LIIKE
            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;

            direction.z = Number(moveForward) - Number(moveBackward);
            direction.x = Number(moveRight) - Number(moveLeft);
            direction.normalize();

            if (moveForward || moveBackward) velocity.z -= direction.z * 100.0 * delta;
            if (moveLeft || moveRight) velocity.x -= direction.x * 100.0 * delta;

            camera.translateX(-velocity.x * delta);
            camera.translateZ(velocity.z * delta);
            camera.position.y = 1.7;

            // TÖRMÄYSTEN TARKISTUS (Seinät)
            if (camera.position.x < -14) camera.position.x = -14;
            if (camera.position.x > 14) camera.position.x = 14;

            // VARTIJOIDEN AI
            guards.forEach(g => {
                g.position.z += 3 * delta * g.dir;
                g.rotation.y = g.dir === 1 ? 0 : Math.PI;
                if (g.position.z > 90 || g.position.z < 0) g.dir *= -1;

                // Detection
                if (camera.position.distanceTo(g.position) < 3.5) {
                    camera.position.set(-8, 1.7, 5);
                    document.getElementById('stat-inv').innerHTML = "HÄLYTYS!";
                    document.getElementById('stat-inv').style.color = "red";
                }
            });
        }

        renderer.render(scene, camera);
    }

    setup();
    window.onresize = () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    };
</script>
</body>
</html>
