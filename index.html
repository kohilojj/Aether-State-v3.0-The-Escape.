<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>AETHER STATE v3.5 | REALISTIC 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #container3d { width: 100%; height: 60vh; background: #050505; position: relative; cursor: crosshair; }
        #game-ui { display: flex; height: 40vh; background: #0a0a0a; border-top: 4px solid #333; }
        #canvas2d { background: #111; border-right: 2px solid #222; }
        #sidebar { flex: 1; padding: 20px; overflow-y: auto; background: linear-gradient(180deg, #0a0a0a 0%, #000 100%); }
        .stat { font-size: 14px; color: #aaa; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .stat b { color: #f1c40f; font-size: 18px; }
        .log { font-size: 12px; color: #00ff41; font-family: 'Courier New', monospace; opacity: 0.8; }
        #ui-overlay { position: absolute; bottom: 10px; left: 20px; pointer-events: none; text-shadow: 2px 2px 5px #000; }
    </style>
</head>
<body>

<div id="container3d">
    <div id="ui-overlay">
        <h2 style="margin:0; color:#ff4d4d; letter-spacing:3px;">OSASTO B-4</h2>
        <p style="margin:0; color:#888;">Klikkaa kohteita tutkiaksesi selliä</p>
    </div>
</div>

<div id="game-ui">
    <canvas id="canvas2d" width="400" height="300"></canvas>
    <div id="sidebar">
        <div class="stat">Vanki: <b>#2701 (KEKSIJÄ)</b></div>
        <div id="status-text" class="stat">Tila: <b>SELLISSÄ</b></div>
        <div id="inv-text" class="stat">Esine: <b>EI MITÄÄN</b></div>
        <div id="log" class="log">> Järjestelmä käynnistetty.</div>
    </div>
</div>

<script>
    // --- 3D-MOOTTORI: ULTRA-YKSITYISKOHDAT ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / (window.innerHeight * 0.6), 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight * 0.6);
    renderer.shadowMap.enabled = true;
    document.getElementById('container3d').appendChild(renderer.domElement);

    // 1. BETONISEINÄT (Teksturoitu tyyli)
    const roomGroup = new THREE.Group();
    const wallMat = new THREE.MeshStandardMaterial({ 
        color: 0x555555, 
        roughness: 0.9, 
        metalness: 0.1,
        side: THREE.BackSide 
    });
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
    
    const roomGeo = new THREE.BoxGeometry(12, 8, 12);
    const room = new THREE.Mesh(roomGeo, wallMat);
    room.receiveShadow = true;
    scene.add(room);

    // 2. YKSITYISKOHTAINEN SÄNKY (Ei vain neliö)
    const bedGroup = new THREE.Group();
    // Jalat
    const legGeo = new THREE.CylinderGeometry(0.05, 0.05, 1);
    const metalMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8, roughness: 0.2 });
    for(let i=0; i<4; i++) {
        const leg = new THREE.Mesh(legGeo, metalMat);
        leg.position.set(i<2 ? -1.8 : 1.8, -3.5, i%2==0 ? -1.8 : 1.8);
        bedGroup.add(leg);
    }
    // Patja
    const matressGeo = new THREE.BoxGeometry(3.8, 0.6, 3.8);
    const matressMat = new THREE.MeshStandardMaterial({ color: 0x777788, roughness: 1 });
    const matress = new THREE.Mesh(matressGeo, matressMat);
    matress.position.y = -3;
    matress.name = "bed";
    bedGroup.add(matress);
    bedGroup.position.set(-3.5, 0, -2);
    scene.add(bedGroup);

    // 3. PAREMPI WC (Keraaminen tyyli)
    const toiletGroup = new THREE.Group();
    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.8, 1.2, 16), new THREE.MeshStandardMaterial({color:0xdddddd}));
    base.position.y = -3.4;
    const seat = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.2, 10, 20), new THREE.MeshStandardMaterial({color:0xeeeeee}));
    seat.rotation.x = Math.PI/2;
    seat.position.y = -2.8;
    toiletGroup.add(base, seat);
    toiletGroup.position.set(4.5, 0, -4.5);
    scene.add(toiletGroup);

    // 4. VALAISTUS (Tunnelmallinen ja välkkyvä)
    const pointLight = new THREE.PointLight(0xffaa66, 1.5, 20);
    pointLight.position.set(0, 3, 0);
    pointLight.castShadow = true;
    scene.add(pointLight);

    const ambient = new THREE.AmbientLight(0x111122, 0.5);
    scene.add(ambient);

    camera.position.set(4, 1, 8);
    camera.lookAt(0, -1, 0);

    // --- PELILOGIIKKA JA LIIKKUMINEN ---
    let gameState = { hasSpoon: false, tunnelFound: false, win: false };
    const addLog = (m) => { document.getElementById('log').innerHTML = "> " + m + "<br>" + document.getElementById('log').innerHTML; };

    // 3D-Klikkaus
    const raycaster = new THREE.Raycaster();
    window.addEventListener('mousedown', (e) => {
        if (e.clientY > window.innerHeight * 0.6) return;
        const mouse = new THREE.Vector2((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / (window.innerHeight * 0.6)) * 2 + 1);
        raycaster.setFromCamera(mouse, camera);
        const hits = raycaster.intersectObjects(scene.children, true);
        if (hits.length > 0) {
            let obj = hits[0].object;
            if (obj.name === "bed" || obj.parent.name === "bed") {
                gameState.tunnelFound = true;
                addLog("Tutkit patjaa... Löysit löysän lautan ja tunnelin suun!");
                pointLight.color.setHex(0xff0000); // Hälytysvalo-efekti
            }
        }
    });

    // --- 2D-KARTTA (WASD KORJATTU) ---
    const canvas = document.getElementById('canvas2d');
    const ctx = canvas.getContext('2d');
    let p = { x: 30, y: 30, r: 8 };
    let guards = [{x: 200, y: 150, dx: 2, dy: 0}, {x: 350, y: 50, dx: 0, dy: 2}];
    let keys = {};

    window.addEventListener('keydown', e => { 
        keys[e.key.toLowerCase()] = true; 
        if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)) e.preventDefault();
    });
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    function loop() {
        if(gameState.win) return;

        // Liike
        if (keys.w || keys.arrowup) p.y -= 3;
        if (keys.s || keys.arrowdown) p.y += 3;
        if (keys.a || keys.arrowleft) p.x -= 3;
        if (keys.d || keys.arrowright) p.x += 3;

        // Vartijat
        guards.forEach(g => {
            g.x += g.dx; g.y += g.dy;
            if(g.x < 100 || g.x > 380) g.dx *= -1;
            if(g.y < 20 || g.y > 280) g.dy *= -1;
            if(Math.hypot(p.x-g.x, p.y-g.y) < 40) { p.x=30; p.y=30; addLog("Vartija yllätti käytävällä!"); }
        });

        // Lusikka
        if(p.x > 350 && p.y > 250 && !gameState.hasSpoon) {
            gameState.hasSpoon = true;
            document.getElementById('inv-text').innerHTML = "Esine: <b>LUSIKKA</b>";
            addLog("Löysit ruosteisen lusikan ruokalasta!");
        }

        // Voitto
        if(p.x < 50 && p.y < 50 && gameState.hasSpoon && gameState.tunnelFound) {
            gameState.win = true;
            alert("VAPAUS! Pakenit Aether Statesta!");
            location.reload();
        }

        // Piirto 2D
        ctx.fillStyle = "#111"; ctx.fillRect(0,0,400,300);
        ctx.fillStyle = "#333"; ctx.fillRect(100,0,20,200); // Seinä
        ctx.fillStyle = "#f1c40f"; ctx.fillText("RUOKALA", 330, 280);
        ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = "red"; guards.forEach(g => { ctx.beginPath(); ctx.arc(g.x,g.y,6,0,Math.PI*2); ctx.fill(); });

        // 3D-animaatio (Välkkyvä valo)
        pointLight.intensity = 1.5 + Math.random() * 0.5;
        renderer.render(scene, camera);
        
        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
