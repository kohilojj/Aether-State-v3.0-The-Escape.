<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>AETHER STATE | LIVING PRISON COMPLEX</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; color: #00ffcc; pointer-events: none; z-index: 10; }
        #blocker { 
            position: absolute; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); display: flex; align-items: center; 
            justify-content: center; color: #fff; cursor: pointer; z-index: 100;
        }
        .hud { 
            background: rgba(0, 10, 10, 0.85); padding: 20px; 
            border: 1px solid #00ffcc; box-shadow: 0 0 20px rgba(0,255,204,0.2);
            border-radius: 5px;
        }
        #crosshair { 
            position: absolute; top: 50%; left: 50%; 
            width: 4px; height: 4px; background: #00ffcc; border-radius: 50%;
        }
    </style>
</head>
<body>

<div id="blocker" onclick="start()">
    <div style="text-align: center;">
        <h1 style="color: #00ffcc; font-size: 40px; letter-spacing: 10px; margin: 0;">AETHER STATE</h1>
        <p style="color: #666;">LIVING PRISON COMPLEX v6.0</p>
        <p style="margin-top: 30px; border: 1px solid #00ffcc; padding: 15px; background: rgba(0,255,204,0.1);">KLIKKAA ALOITTAAKSESI PAKA</p>
    </div>
</div>

<div id="ui">
    <div class="hud">
        <div id="status">OSASTO: <b>B-LOHKO</b></div>
        <div id="inv">VARUSTEET: <b>TYHJÄ</b></div>
        <div id="msg" style="color: #ff3333; margin-top: 5px;">> POISTU SELLISTÄ</div>
    </div>
</div>

<div id="crosshair"></div>

<script>
    let gameStarted = false;
    function start() {
        document.body.requestPointerLock();
        document.getElementById('blocker').style.display = 'none';
        gameStarted = true;
    }

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050505, 0.08);
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true; // Varjot käyttöön
    document.body.appendChild(renderer.domElement);

    // TEKSTUURILATAUS (Oikeasti pitäisi ladata kuvatiedostoista)
    const textureLoader = new THREE.TextureLoader();
    const wallTexture = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.9, map: textureLoader.load('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABAAQMAAACQp+nLAAAABlBMVEVHcEwAAAAqO+F+AAAAAXRSTlMAQObYZgAAABFJREFUeNpjYBgFo2AUjAIpAAAA7gABgK27pQAAAABJRU5ErkJggg==') }); // Pieni harmaa betoni
    const floorTexture = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.5, roughness: 0.6, map: textureLoader.load('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABAAQMAAACQp+nLAAAABlBMVEVHcEwAAAAqO+F+AAAAAXRSTlMAQObYZgAAABFJREFUeNpjYBgFo2AUjAIpAAAA7gABgK27pQAAAABJRU5ErkJggg==') }); // Pieni tumma ruudukko
    const barMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, metalness: 1, roughness: 0.1 });
    const inmateMat = new THREE.MeshStandardMaterial({ color: 0x445588, roughness: 0.8 });
    const toiletMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.2 });

    // Lattia ja katto
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), floorTexture);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), wallTexture);
    ceiling.rotation.x = Math.PI / 2;
    ceiling.position.y = 8;
    ceiling.receiveShadow = true;
    scene.add(ceiling);

    // KESKITETTY VALAISTUS (Paremmat varjot)
    const ambient = new THREE.AmbientLight(0x222222, 0.5);
    scene.add(ambient);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(0, 10, 0);
    directionalLight.castShadow = true;
    directionalLight.shadow.mapSize.width = 1024;
    directionalLight.shadow.mapSize.height = 1024;
    directionalLight.shadow.camera.near = 0.5;
    directionalLight.shadow.camera.far = 50;
    scene.add(directionalLight);

    function createCell(zOffset, xOffset = -10) {
        // Takaseinä
        const backWall = new THREE.Mesh(new THREE.BoxGeometry(10, 8, 0.5), wallTexture);
        backWall.position.set(xOffset, 4, zOffset);
        backWall.castShadow = true; backWall.receiveShadow = true;
        scene.add(backWall);

        // Sivuseinät
        const side1 = new THREE.Mesh(new THREE.BoxGeometry(10, 8, 0.5), wallTexture);
        side1.rotation.y = Math.PI / 2;
        side1.position.set(xOffset - 5, 4, zOffset - 5);
        side1.castShadow = true; side1.receiveShadow = true;
        scene.add(side1);

        const side2 = side1.clone();
        side2.position.set(xOffset + 5, 4, zOffset - 5);
        side2.castShadow = true; side2.receiveShadow = true;
        scene.add(side2);

        // Kalterit (Parempi malli, lukittu ovi)
        for(let i = -4.5; i <= 4.5; i += 0.8) {
            const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 8), barMat);
            bar.position.set(xOffset + 5, 4, zOffset - 5 + i);
            bar.castShadow = true; bar.receiveShadow = true;
            scene.add(bar);
        }

        // Sänky (Tyyny ja jalkarunko)
        const bedGroup = new THREE.Group();
        const bedFrame = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.2, 5), barMat);
        const bedMattress = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.3, 4.8), inmateMat);
        bedMattress.position.y = 0.25;
        const pillow = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.2, 0.8), inmateMat);
        pillow.position.set(0, 0.45, -2);
        bedGroup.add(bedFrame, bedMattress, pillow);
        bedGroup.position.set(xOffset - 2.5, 0.2, zOffset - 2.5);
        bedGroup.castShadow = true; bedGroup.receiveShadow = true;
        scene.add(bedGroup);

        // WC-istuin
        const toilet = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.5, 0.8), toiletMat);
        toilet.position.set(xOffset + 3, 0.4, zOffset - 4);
        toilet.castShadow = true; toilet.receiveShadow = true;
        scene.add(toilet);

        // Point Light jokaisessa sellissä
        const cellLight = new THREE.PointLight(0xffcc99, 0.5, 10);
        cellLight.position.set(xOffset, 5, zOffset - 2);
        cellLight.castShadow = true;
        scene.add(cellLight);
    }

    // Luodaan 5 selliä riviin molemmille puolille käytävää
    for(let i = 0; i < 5; i++) {
        createCell(i * 12, -10); // Vasen puoli
        createCell(i * 12, 10);  // Oikea puoli
    }

    // KÄYTÄVÄN ULKOSEINÄT
    const outerWallLeft = new THREE.Mesh(new THREE.BoxGeometry(0.5, 8, 70), wallTexture);
    outerWallLeft.position.set(-15, 4, 25);
    outerWallLeft.castShadow = true; outerWallLeft.receiveShadow = true;
    scene.add(outerWallLeft);

    const outerWallRight = outerWallLeft.clone();
    outerWallRight.position.x = 15;
    scene.add(outerWallRight);

    // KÄYTÄVÄN VALOT
    for(let i = 0; i < 6; i++) {
        const light = new THREE.PointLight(0xffaa00, 1.5, 20);
        light.position.set(0, 7, i * 12);
        light.castShadow = true;
        scene.add(light);
    }

    // --- TEKOÄLYT: VANGIT JA VARTIJAT ---
    const inmates = [];
    const inmateGeo = new THREE.CapsuleGeometry(0.3, 1.2, 8, 16);
    const inmateColors = [0x5566aa, 0x884433, 0x338855];

    function createInmate(x, y, z, initialDir) {
        const mat = new THREE.MeshStandardMaterial({ color: inmateColors[Math.floor(Math.random() * inmateColors.length)] });
        const inmate = new THREE.Mesh(inmateGeo, mat);
        inmate.position.set(x, y, z);
        inmate.castShadow = true; inmate.receiveShadow = true;
        inmate.dir = initialDir; // -1 = z--, 1 = z++, 0 = x
        inmates.push(inmate);
        scene.add(inmate);
        return inmate;
    }

    // Vangit selleissä
    for(let i = 0; i < 5; i++) {
        createInmate(-10, 1, i * 12 - 2, 1); // Vasen sänky
        createInmate(10, 1, i * 12 + 2, -1); // Oikea sänky
    }

    const guards = [];
    const guardMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.9, roughness: 0.1 });

    function createGuard(x, y, z, initialDir) {
        const guardGroup = new THREE.Group();
        const gBody = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2.5, 1.5), guardMat);
        gBody.castShadow = true; gBody.receiveShadow = true;
        const gHead = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), guardMat);
        gHead.position.y = 1.7;
        gHead.castShadow = true; gHead.receiveShadow = true;
        const gEye = new THREE.PointLight(0xff0000, 1, 5); // Punainen valo
        gEye.position.set(0, 1.7, 0.6);
        gEye.castShadow = true;
        guardGroup.add(gBody, gHead, gEye);
        guardGroup.position.set(x, y, z);
        guardGroup.dir = initialDir; // 1 = z++, -1 = z--
        guards.push(guardGroup);
        scene.add(guardGroup);
        return guardGroup;
    }

    // Kaksi vartijaa käytävällä
    createGuard(0, 1.25, 10, 1);
    createGuard(0, 1.25, 40, -1);

    // OHJAUS
    let keys = {};
    document.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
    document.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);
    document.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement) {
            camera.rotation.y -= e.movementX * 0.002;
            camera.rotation.x -= e.movementY * 0.002;
            camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
        }
    });
    camera.rotation.order = 'YXZ';
    camera.position.set(-10, 1.7, 0); // Aloitus sellissä

    // PELISILMUKKA
    let hasSpoon = false;

    function animate() {
        requestAnimationFrame(animate);
        if (gameStarted && document.pointerLockElement) {
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            dir.y = 0; dir.normalize();
            const side = new THREE.Vector3().crossVectors(new THREE.Vector3(0,1,0), dir).normalize();

            if (keys.w) camera.position.addScaledVector(dir, 0.08);
            if (keys.s) camera.position.addScaledVector(dir, -0.08);
            if (keys.a) camera.position.addScaledVector(side, 0.08);
            if (keys.d) camera.position.addScaledVector(side, -0.08);

            // Inmates AI
            inmates.forEach(inmate => {
                inmate.position.z += inmate.dir * 0.02;
                if (inmate.position.z > inmate.parent.position.z + 4 || inmate.position.z < inmate.parent.position.z - 4) {
                    inmate.dir *= -1;
                    inmate.rotation.y += Math.PI; // Kääntyy ympäri
                }
            });

            // Guards AI
            guards.forEach(guard => {
                guard.position.z += guard.dir * 0.05;
                if (guard.position.z > 50 || guard.position.z < 0) {
                    guard.dir *= -1;
                    guard.rotation.y += Math.PI; // Kääntyy ympäri
                }
                // Guards' eye light follows player slightly
                guard.children[2].lookAt(camera.position);

                // Detection
                if (camera.position.distanceTo(guard.position) < 3) { // Detection radius
                    camera.position.set(-10, 1.7, 0); // Back to cell
                    document.getElementById('msg').innerHTML = "> HÄLYTYS! VARTIJA HAVAITSI SINUT.";
                    document.getElementById('msg').style.color = "red";
                }
            });

            // Player position restrictions (stay within corridor)
            camera.position.x = Math.max(-14.5, Math.min(14.5, camera.position.x));
            camera.position.z = Math.max(-4.5, Math.min(54.5, camera.position.z));

            // Placeholder for actual escape mechanics
            if (camera.position.x > 4 && camera.position.z > 50) { // Escape point
                document.getElementById('msg').innerHTML = "> LÖYSIT ULOSKÄYNNIN! PAKO ONNISTUI!";
                document.getElementById('msg').style.color = "#00ffcc";
                // alert("VOITIT PELIN!");
                // location.reload();
            }
        }
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
