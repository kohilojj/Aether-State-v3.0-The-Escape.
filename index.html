<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>AETHER STATE | OFFICIAL 3D GAME</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; color: #00ffcc; pointer-events: none; z-index: 10; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; border: 2px solid #00ffcc; border-radius: 50%; transform: translate(-50%, -50%); }
        #blocker { position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; color: #fff; cursor: pointer; text-align: center; z-index: 20; }
        .hud { background: rgba(0,40,40,0.6); padding: 20px; border: 2px solid #00ffcc; border-radius: 10px; }
    </style>
</head>
<body>

<div id="blocker">
    <div>
        <h1 style="color: #00ffcc; font-size: 60px; letter-spacing: 5px;">AETHER STATE</h1>
        <p>KLIKKAA TÄSTÄ PELATAKSESI</p>
        <p style="color: #888;">WASD = Liiku | HIIRI = Katso</p>
    </div>
</div>

<div id="ui">
    <div class="hud">
        <div id="status">TILA: SELLISSÄ #2701</div>
        <div id="inventory">REPU: TYHJÄ</div>
        <div id="mission" style="color: #ffcc00; margin-top: 10px;">ETSI LUSIKKA RUOKALASTA</div>
    </div>
</div>

<div id="crosshair"></div>

<script>
    // --- 1. PELIN ASETUKSET ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020202);
    scene.fog = new THREE.FogExp2(0x020202, 0.1);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // --- 2. GRAFIIKAT JA VÄRIT ---
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.7 });
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.6, roughness: 0.4 });
    const metalMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.9 });
    const neonMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });

    // Lattia
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Rakennetaan vankila (Seinät ja käytävät)
    function createWall(x, z, w, d, color = 0x333333) {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, 7, d), new THREE.MeshStandardMaterial({color: color}));
        mesh.position.set(x, 3.5, z);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
    }

    // Selli
    createWall(-5, -5, 10, 0.5); // Takaseinä
    createWall(-10, 0, 0.5, 10); // Vasen
    createWall(-5, 5, 4, 0.5);   // Etuseinä vasen
    createWall(0, 5, 4, 0.5);    // Etuseinä oikea (ovi välissä)

    // Käytävä
    createWall(5, 15, 0.5, 30, 0x222222); // Käytävän seinä
    createWall(-5, 15, 0.5, 20, 0x222222);

    // Ruokala
    createWall(0, 35, 15, 0.5, 0x444444);
    const table = new THREE.Mesh(new THREE.BoxGeometry(5, 1, 3), metalMat);
    table.position.set(5, 0.5, 30);
    scene.add(table);

    // Lusikka (Pako-esine)
    const spoon = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), metalMat);
    spoon.position.set(5, 1.2, 30);
    scene.add(spoon);

    // Valot (Oranssi vankilavalo)
    const ambient = new THREE.AmbientLight(0x404040, 0.3);
    scene.add(ambient);

    function addLight(x, z) {
        const light = new THREE.PointLight(0xffaa44, 2, 20);
        light.position.set(x, 6, z);
        light.castShadow = true;
        scene.add(light);
    }
    addLight(-5, 0); // Selli
    addLight(0, 15); // Käytävä 1
    addLight(0, 30); // Käytävä 2

    // --- 3. ROBOTTIVARTIJA ---
    const guard = new THREE.Group();
    const gBody = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 1.5), metalMat);
    const gHead = new THREE.Mesh(new THREE.SphereGeometry(0.4), new THREE.MeshStandardMaterial({color: 0xff0000}));
    gHead.position.y = 1;
    guard.add(gBody, gHead);
    guard.position.set(0, 1, 20);
    scene.add(guard);

    // --- 4. PELAAJAN ASE (PULSSITYKKI) ---
    const gun = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.8), new THREE.MeshStandardMaterial({color: 0x111111}));
    const gunGlow = new THREE.Mesh(new THREE.BoxGeometry(0.21, 0.21, 0.2), neonMat);
    gunGlow.position.z = -0.3;
    gun.add(gunGlow);
    camera.add(gun);
    gun.position.set(0.4, -0.3, -0.6);
    scene.add(camera);

    // --- 5. LIIKKUMINEN JA OHJAUS ---
    let keys = { w: false, a: false, s: false, d: false };
    let hasSpoon = false;

    document.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
    document.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);
    
    document.getElementById('blocker').addEventListener('click', () => {
        document.body.requestPointerLock();
    });

    document.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement) {
            camera.rotation.y -= e.movementX * 0.002;
            camera.rotation.x -= e.movementY * 0.002;
            camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
        }
    });

    camera.rotation.order = 'YXZ';
    camera.position.set(-5, 1.7, 0);

    // --- 6. PELISILMUKKA ---
    let guardDir = 1;
    function animate() {
        requestAnimationFrame(animate);

        if (document.pointerLockElement) {
            // Liikkuminen
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            dir.y = 0; dir.normalize();
            const side = new THREE.Vector3().crossVectors(new THREE.Vector3(0,1,0), dir).normalize();

            if (keys.w) camera.position.addScaledVector(dir, 0.1);
            if (keys.s) camera.position.addScaledVector(dir, -0.1);
            if (keys.a) camera.position.addScaledVector(side, 0.1);
            if (keys.d) camera.position.addScaledVector(side, -0.1);

            // Vartijan liike
            guard.position.z += 0.06 * guardDir;
            if (guard.position.z > 30 || guard.position.z < 10) guardDir *= -1;

            // Törmäykset
            if (camera.position.distanceTo(guard.position) < 1.5) {
                camera.position.set(-5, 1.7, 0);
                document.getElementById('mission').innerHTML = "VARTIJA HAVAITSI SINUT! PAKENE UUDELLEEN.";
                document.getElementById('mission').style.color = "red";
            }

            // Lusikan poiminta
            if (!hasSpoon && camera.position.distanceTo(spoon.position) < 2) {
                hasSpoon = true;
                spoon.visible = false;
                document.getElementById('inventory').innerHTML = "REPU: MULTI-LUSIKKA";
                document.getElementById('mission').innerHTML = "LUSIKKA HALLUSSA! PALAA SELLIIN.";
                document.getElementById('mission').style.color = "#00ffcc";
            }

            // Voitto
            if (hasSpoon && camera.position.z < 1 && camera.position.x < -3) {
                alert("VAPAUS! Pakenit Aether Statesta!");
                location.reload();
            }
        }

        renderer.render(scene, camera);
    }

    animate();
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

</body>
</html>
