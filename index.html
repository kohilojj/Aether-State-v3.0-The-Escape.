<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>AETHER STATE | THE COMPLEX</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; color: #00ffcc; pointer-events: none; z-index: 10; }
        .hud { background: rgba(0,20,20,0.85); padding: 15px; border: 2px solid #00ffcc; border-radius: 5px; }
        #blocker { position: absolute; width: 100%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; color: #fff; cursor: pointer; z-index: 100; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: #00ffcc; border-radius: 50%; transform: translate(-50%, -50%); }
    </style>
</head>
<body>

<div id="blocker" onclick="this.style.display='none'; document.body.requestPointerLock();">
    <div style="text-align: center;">
        <h1 style="color: #00ffcc; font-size: 45px; margin: 0;">AETHER STATE: COMPLEX</h1>
        <p>TÄYSI VANKILA: Piha, Ruokala, Suihkut, Sellit</p>
        <p style="margin-top: 30px; border: 1px solid #fff; padding: 10px;">KLIKKAA ALOITTAAKSESI</p>
    </div>
</div>

<div id="ui">
    <div class="hud">
        <div id="loc">SIJAINTI: SELLI-OSASTO</div>
        <div id="task" style="color: #ffcc00;">TEHTÄVÄ: Etsi tie ulkoilupihalle</div>
    </div>
</div>

<div id="crosshair"></div>

<script>
    // --- MOOTTORIN ASETUKSET ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050505, 0.1);
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // MATERIAALIT
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a });
    const metalMat = new THREE.MeshStandardMaterial({ color: 0x777777, metalness: 0.8 });
    const grassMat = new THREE.MeshStandardMaterial({ color: 0x112211 }); // Pihan "ruoho"

    // --- RAKENTAMINEN ---

    function createWall(w, h, d, x, y, z, mat = wallMat) {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
        mesh.position.set(x, y, z);
        mesh.receiveShadow = true;
        mesh.castShadow = true;
        scene.add(mesh);
        return mesh;
    }

    // 1. SELLIOSASTO (Aloitus)
    for(let i = 0; i < 4; i++) {
        let z = i * 8;
        createWall(6, 4, 0.2, -8, 2, z); // Takaseinä
        createWall(0.2, 4, 6, -11, 2, z - 3); // Sivuseinä
        createWall(0.2, 4, 6, -5, 2, z - 3); // Kalteriseinä
        // Kalterit
        for(let b = -2.5; b <= 2.5; b += 0.6) {
            const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 4), metalMat);
            bar.position.set(-5, 2, z - 3 + b);
            scene.add(bar);
        }
    }

    // 2. RUOKALA (Iso huone)
    createWall(20, 0.2, 20, 15, 0, 10, floorMat); // Lattia
    createWall(20, 5, 0.2, 15, 2.5, 0); // Seinä
    // Pöydät
    for(let px = 10; px <= 20; px += 5) {
        for(let pz = 5; pz <= 15; pz += 5) {
            const tTop = createWall(3, 0.2, 1.5, px, 0.8, pz, metalMat);
            const tLeg = createWall(0.1, 0.8, 0.1, px, 0.4, pz, metalMat);
        }
    }

    // 3. SUIHKUT (Kaakeliseinät)
    const showerMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa });
    createWall(10, 4, 0.2, 15, 2, 30, showerMat);
    for(let s = 12; s <= 18; s += 2) {
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.1), metalMat);
        head.position.set(s, 3, 29.8);
        scene.add(head);
    }

    // 4. ULKOILUPIHA (Aita ja taivas)
    const yardFloor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), grassMat);
    yardFloor.rotation.x = -Math.PI / 2;
    yardFloor.position.set(40, 0.01, 15);
    scene.add(yardFloor);
    // Aita (Kalterit ympärillä)
    for(let a = 0; a <= 40; a += 2) {
        const post = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 6), metalMat);
        post.position.set(20, 3, a - 5);
        scene.add(post);
    }
    // Painonnostopenkki pihalla
    createWall(1, 0.5, 3, 35, 0.25, 15, wallMat);
    createWall(3, 0.1, 0.1, 35, 1.2, 15, metalMat); // Levytanko

    // VALAISTUS
    scene.add(new THREE.AmbientLight(0x404040, 0.6));
    const sun = new THREE.DirectionalLight(0xffffff, 0.8);
    sun.position.set(50, 50, 50);
    scene.add(sun);

    // VARTIJA (AI)
    const guards = [];
    function addGuard(x, z, range) {
        const g = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.8, 0.7), metalMat);
        const eye = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.1, 0.2), new THREE.MeshBasicMaterial({color: 0xff0000}));
        eye.position.set(0, 0.7, 0.3);
        g.add(body, eye);
        g.position.set(x, 0.9, z);
        g.startZ = z;
        g.range = range;
        g.dir = 1;
        scene.add(g);
        guards.push(g);
    }
    addGuard(0, 10, 15); // Käytävävartija
    addGuard(15, 10, 5);  // Ruokalavartija

    // --- OHJAUS (Tarkka Minecraft-tyyli) ---
    let keys = {};
    document.addEventListener('keydown', (e) => keys[e.code] = true);
    document.addEventListener('keyup', (e) => keys[e.code] = false);
    document.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement) {
            camera.rotation.y -= e.movementX * 0.002;
            camera.rotation.x -= e.movementY * 0.002;
            camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
        }
    });

    camera.rotation.order = 'YXZ';
    camera.position.set(-8, 1.7, 0);

    function animate() {
        requestAnimationFrame(animate);
        
        if (document.pointerLockElement) {
            const speed = 0.12;
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            dir.y = 0; dir.normalize();
            const side = new THREE.Vector3().crossVectors(new THREE.Vector3(0,1,0), dir).normalize();

            if (keys['KeyW']) camera.position.addScaledVector(dir, speed);
            if (keys['KeyS']) camera.position.addScaledVector(dir, -speed);
            if (keys['KeyA']) camera.position.addScaledVector(side, speed);
            if (keys['KeyD']) camera.position.addScaledVector(side, -speed);

            // Sijainti-päivitys UI:hin
            if (camera.position.x > 30) document.getElementById('loc').innerHTML = "SIJAINTI: ULKOILUPIHA";
            else if (camera.position.x > 10) document.getElementById('loc').innerHTML = "SIJAINTI: RUOKALA / SUIHKUT";
            else document.getElementById('loc').innerHTML = "SIJAINTI: SELLI-OSASTO";

            // Vartijoiden päivitys
            guards.forEach(g => {
                g.position.z += 0.06 * g.dir;
                if (Math.abs(g.position.z - g.startZ) > g.range) g.dir *= -1;
                
                if (camera.position.distanceTo(g.position) < 2) {
                    camera.position.set(-8, 1.7, 0); // Takaisin selliin
                }
            });
        }
        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
